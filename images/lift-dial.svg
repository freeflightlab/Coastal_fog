<svg class="dial" id="dial" role="img" aria-labelledby="dialTitle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" width="320" height="196"><style>svg{background:#fff;color:#213444}text{font-family:Arial,sans-serif;font-size:12px;fill:#4a5d6e}/* dial */
.dial{display:block;width:100%;max-width:330px;height:auto;margin:0 auto;overflow:visible}.track{fill:none;stroke-width:16}.axis{fill:none;stroke:#D3DDE4;stroke-width:1}.tk{stroke:#5F6F7D;stroke-width:1}.tk.major{stroke:#43566A;stroke-width:1.6}text{font:500 12.5px "Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;fill:#5F6F7D}.end{font:600 11.5px "Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;letter-spacing:.16em;fill:#43566A}.std{stroke:#0F1E2A;stroke-width:2}.std-halo{stroke:#FFFFFF;stroke-width:5}.std-mark{fill:#0F1E2A}.std-label{font:500 11.5px "Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;fill:#43566A}.needle{transform-box:view-box;transform-origin:160px 156px;transition:transform .35s cubic-bezier(.25,.8,.3,1)}.needle line{stroke:#D4442A;stroke-width:3;stroke-linecap:round}.needle circle{fill:#D4442A;stroke:#FFFFFF;stroke-width:3}.needle{transition:none}.plot{position:relative;touch-action:pan-y;cursor:crosshair;border-radius:4px;-webkit-tap-highlight-color:transparent}svg{display:block;width:100%;height:auto;overflow:visible;user-select:none;-webkit-user-select:none}.grid{stroke:#E2E9EE;stroke-width:1}.axis{stroke:#D3DDE4;stroke-width:1}text{font:500 12.5px "Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;fill:#5F6F7D;font-variant-numeric:tabular-nums}.end-label,.pt-label,.lbl{fill:#43566A;font-weight:600}.std{stroke:#5F6F7D;stroke-width:1}.halo{paint-order:stroke;stroke:#F1F5F7;stroke-width:4px;stroke-linejoin:round}.band{fill:rgba(37,106,191,.09)}.wash2{opacity:.16}.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.pt{fill:#0d366b;stroke:#F1F5F7;stroke-width:2}.now-line{stroke:#D4442A;stroke-width:1;opacity:.6}.now-dot{fill:#D4442A;stroke:#F1F5F7;stroke-width:2}.cross{stroke:#5F6F7D;stroke-width:1}.hdot{stroke:#F1F5F7;stroke-width:2}.env{fill:none;stroke:#33405C;stroke-width:2;stroke-linejoin:round}.par{fill:none;stroke:#184f95;stroke-width:2;stroke-linejoin:round}.par.faded{opacity:.35}.dry{fill:none;stroke:#5F6F7D;stroke-width:1;opacity:.7}.posw{fill:rgba(31,138,112,.15)}.negw{fill:rgba(196,102,28,.15)}.lvl{stroke:#5F6F7D;stroke-width:1}.lband{fill:#E7EFF5;opacity:.7}.rock{fill:#8E9AB1;opacity:.55}.fogl{stroke:#256abf;stroke-width:1}.pdot{fill:#184f95;stroke:#F1F5F7;stroke-width:2}</style><rect x="0" y="0" width="320.0" height="196.0" fill="#ffffff"/><title id="dialTitle">Air density gauge from soft (1.10 kg/m&#179;) to punchy (1.30 kg/m&#179;)</title><defs><linearGradient id="dialGrad" x1="48" y1="0" x2="272" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:#DCE2EB"/><stop offset="1" style="stop-color:#33405C"/></linearGradient></defs><path class="axis" d="M57 156 A103 103 0 0 1 263 156"/><path class="track" stroke="url(#dialGrad)" d="M48 156 A112 112 0 0 1 272 156"/><line class="tk major" x1="37.0" y1="156.0" x2="28.0" y2="156.0"/><text x="15.0" y="160.0" text-anchor="middle">1.10</text><line class="tk" x1="38.5" y1="136.8" x2="34.6" y2="136.1"/><line class="tk" x1="43.0" y1="118.0" x2="39.2" y2="116.8"/><line class="tk" x1="50.4" y1="100.2" x2="46.8" y2="98.3"/><line class="tk" x1="60.5" y1="83.7" x2="57.3" y2="81.4"/><line class="tk major" x1="73.0" y1="69.0" x2="66.7" y2="62.7"/><text x="57.5" y="57.5" text-anchor="middle">1.15</text><line class="tk" x1="87.7" y1="56.5" x2="85.4" y2="53.3"/><line class="tk" x1="104.2" y1="46.4" x2="102.3" y2="42.8"/><line class="tk" x1="122.0" y1="39.0" x2="120.8" y2="35.2"/><line class="tk" x1="140.8" y1="34.5" x2="140.1" y2="30.6"/><line class="tk major" x1="160.0" y1="33.0" x2="160.0" y2="24.0"/><text x="160.0" y="15.0" text-anchor="middle">1.20</text><line class="tk" x1="179.2" y1="34.5" x2="179.9" y2="30.6"/><line class="tk" x1="198.0" y1="39.0" x2="199.2" y2="35.2"/><line class="tk" x1="215.8" y1="46.4" x2="217.7" y2="42.8"/><line class="tk" x1="232.3" y1="56.5" x2="234.6" y2="53.3"/><line class="tk major" x1="247.0" y1="69.0" 